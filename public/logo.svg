<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">

  <!-- White background circle for icon usage -->
  <circle cx="100" cy="100" r="98" fill="white" stroke="#e0e0e0" stroke-width="1"/>

  <!-- ===== BUILDINGS (top) ===== -->
  <!-- Far-left thin tall building -->
  <rect x="30" y="30" width="14" height="50" fill="#7a8fa8" stroke="#6a7f96" stroke-width="0.5"/>
  <rect x="33" y="34" width="3" height="4" fill="#b0c4d8" opacity="0.8"/>
  <rect x="38" y="34" width="3" height="4" fill="#b0c4d8" opacity="0.8"/>
  <rect x="33" y="42" width="3" height="4" fill="#b0c4d8" opacity="0.8"/>
  <rect x="38" y="42" width="3" height="4" fill="#b0c4d8" opacity="0.8"/>
  <rect x="33" y="50" width="3" height="4" fill="#b0c4d8" opacity="0.8"/>
  <rect x="38" y="50" width="3" height="4" fill="#b0c4d8" opacity="0.8"/>
  <rect x="33" y="58" width="3" height="4" fill="#b0c4d8" opacity="0.8"/>
  <rect x="38" y="58" width="3" height="4" fill="#b0c4d8" opacity="0.8"/>
  <!-- spire -->
  <rect x="36" y="25" width="2" height="5" fill="#8a9fb8"/>

  <!-- Left building (taller) -->
  <rect x="46" y="22" width="18" height="58" fill="#8a9fb8" stroke="#7a8fa8" stroke-width="0.5"/>
  <rect x="49" y="26" width="4" height="5" fill="#b0c4d8" opacity="0.8"/>
  <rect x="56" y="26" width="4" height="5" fill="#b0c4d8" opacity="0.8"/>
  <rect x="49" y="35" width="4" height="5" fill="#b0c4d8" opacity="0.8"/>
  <rect x="56" y="35" width="4" height="5" fill="#b0c4d8" opacity="0.8"/>
  <rect x="49" y="44" width="4" height="5" fill="#b0c4d8" opacity="0.8"/>
  <rect x="56" y="44" width="4" height="5" fill="#b0c4d8" opacity="0.8"/>
  <rect x="49" y="53" width="4" height="5" fill="#b0c4d8" opacity="0.8"/>
  <rect x="56" y="53" width="4" height="5" fill="#b0c4d8" opacity="0.8"/>
  <rect x="49" y="62" width="4" height="5" fill="#b0c4d8" opacity="0.8"/>
  <rect x="56" y="62" width="4" height="5" fill="#b0c4d8" opacity="0.8"/>
  <!-- spire -->
  <polygon points="50,22 55,16 60,22" fill="#7a8fa8"/>
  <rect x="54" y="12" width="2" height="4" fill="#8a9fb8"/>

  <!-- Right building (taller) -->
  <rect x="136" y="22" width="18" height="58" fill="#8a9fb8" stroke="#7a8fa8" stroke-width="0.5"/>
  <rect x="139" y="26" width="4" height="5" fill="#b0c4d8" opacity="0.8"/>
  <rect x="146" y="26" width="4" height="5" fill="#b0c4d8" opacity="0.8"/>
  <rect x="139" y="35" width="4" height="5" fill="#b0c4d8" opacity="0.8"/>
  <rect x="146" y="35" width="4" height="5" fill="#b0c4d8" opacity="0.8"/>
  <rect x="139" y="44" width="4" height="5" fill="#b0c4d8" opacity="0.8"/>
  <rect x="146" y="44" width="4" height="5" fill="#b0c4d8" opacity="0.8"/>
  <rect x="139" y="53" width="4" height="5" fill="#b0c4d8" opacity="0.8"/>
  <rect x="146" y="53" width="4" height="5" fill="#b0c4d8" opacity="0.8"/>
  <rect x="139" y="62" width="4" height="5" fill="#b0c4d8" opacity="0.8"/>
  <rect x="146" y="62" width="4" height="5" fill="#b0c4d8" opacity="0.8"/>
  <!-- spire -->
  <polygon points="140,22 145,16 150,22" fill="#7a8fa8"/>
  <rect x="144" y="12" width="2" height="4" fill="#8a9fb8"/>

  <!-- Far-right thin tall building -->
  <rect x="156" y="30" width="14" height="50" fill="#7a8fa8" stroke="#6a7f96" stroke-width="0.5"/>
  <rect x="159" y="34" width="3" height="4" fill="#b0c4d8" opacity="0.8"/>
  <rect x="164" y="34" width="3" height="4" fill="#b0c4d8" opacity="0.8"/>
  <rect x="159" y="42" width="3" height="4" fill="#b0c4d8" opacity="0.8"/>
  <rect x="164" y="42" width="3" height="4" fill="#b0c4d8" opacity="0.8"/>
  <rect x="159" y="50" width="3" height="4" fill="#b0c4d8" opacity="0.8"/>
  <rect x="164" y="50" width="3" height="4" fill="#b0c4d8" opacity="0.8"/>
  <rect x="159" y="58" width="3" height="4" fill="#b0c4d8" opacity="0.8"/>
  <rect x="164" y="58" width="3" height="4" fill="#b0c4d8" opacity="0.8"/>
  <!-- spire -->
  <rect x="162" y="25" width="2" height="5" fill="#8a9fb8"/>

  <!-- ===== HOUSE ROOF ===== -->
  <polygon points="100,68 66,88 134,88" fill="#8a9fb8" stroke="#6a7f96" stroke-width="1"/>
  <!-- Roof shading -->
  <polygon points="100,68 134,88 134,88 100,82" fill="#7a8fa8"/>
  <!-- Chimney -->
  <rect x="120" y="74" width="5" height="10" fill="#8a9fb8"/>

  <!-- House body -->
  <rect x="72" y="88" width="56" height="32" fill="#9aafc8" stroke="#7a8fa8" stroke-width="0.8"/>
  <!-- Door -->
  <rect x="91" y="100" width="18" height="20" rx="9" fill="#5a6f88"/>
  <!-- Windows -->
  <rect x="76" y="93" width="10" height="8" rx="1" fill="#c8d8e8" opacity="0.9"/>
  <rect x="114" y="93" width="10" height="8" rx="1" fill="#c8d8e8" opacity="0.9"/>

  <!-- ===== BIG "H" ===== -->
  <!-- Left vertical bar of H -->
  <rect x="48" y="116" width="24" height="70" rx="3" fill="#1c2d6e"/>
  <!-- Right vertical bar of H -->
  <rect x="128" y="116" width="24" height="70" rx="3" fill="#1c2d6e"/>
  <!-- Crossbar of H -->
  <rect x="48" y="146" width="104" height="18" rx="3" fill="#1c2d6e"/>

  <!-- ===== RED CURVED SWOOSH ===== -->
  <path d="M 42 162 Q 100 134 158 162 Q 138 175 100 172 Q 62 175 42 162 Z"
        fill="#c0392b"/>
  <!-- swoosh highlight line -->
  <path d="M 48 158 Q 100 132 152 158"
        fill="none" stroke="#e05545" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- ===== TEXT ===== -->
  <text x="100" y="205"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="17"
        font-weight="700"
        fill="#c0392b"
        letter-spacing="0.3">Havenley</text>
  <text x="100" y="221"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13"
        font-weight="700"
        fill="#1c2d6e"
        letter-spacing="0.2">Infrastructures</text>
</svg>
